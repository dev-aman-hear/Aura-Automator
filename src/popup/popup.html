<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Automator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="dark">
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="Aura Automator Logo" width="32" height="32" style="border-radius: 6px;">
        <div class="brand-text">
          <h1>Aura Automator</h1>
          <p>Automate repetitive website tasks</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="openDashboardBtn" class="icon-btn" title="Open Full Dashboard">⚙️</button>
      </div>
    </header>

    <!-- Execution Status Bar (Visible when task is running) -->
    <div id="executionBanner" class="execution-banner hidden">
      <div class="status-info">
        <span class="status-indicator pulse"></span>
        <span id="runningTaskName" class="task-name">Running Task...</span>
        <span id="stateBadge" class="loop-counter-badge" style="background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.4);">STARTING_LOOP</span>
        <span id="loopCounterBadge" class="loop-counter-badge">LOOP #1</span>
      </div>
      <div id="liveTimerBar" class="live-timer-bar">
        <span class="timer-icon">⏳</span>
        <span id="liveTimerText" class="timer-text">Next action: Starting Loop #1</span>
      </div>
      <div id="lastLogSnippet" class="log-snippet" style="font-family: monospace; font-size: 10px; color: #94a3b8; margin: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
        [00:00:00] Initializing automation engine...
      </div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
      </div>
      <div class="execution-controls" style="display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px;">
        <button id="pauseTaskBtn" class="btn btn-secondary btn-sm" style="font-size: 11px; padding: 4px 10px;">⏸️ Pause</button>
        <button id="resumeTaskBtn" class="btn btn-primary btn-sm hidden" style="font-size: 11px; padding: 4px 10px;">▶️ Resume</button>
        <button id="stopTaskBtn" class="stop-btn" style="font-size: 11px; padding: 4px 10px;">🛑 Stop</button>
      </div>
    </div>

    <!-- Quick Run Section -->
    <section class="quick-run-card">
      <label for="taskSelect" class="section-label">Quick Run Task</label>
      <div class="select-wrapper">
        <select id="taskSelect">
          <option value="" disabled selected>Select a task to execute...</option>
        </select>
      </div>
      <button id="runTaskBtn" class="btn btn-primary btn-block">
        <span class="btn-icon">▶</span> Run Task
      </button>
    </section>

    <!-- Quick Action Links -->
    <section class="quick-actions">
      <button id="newTaskBtn" class="action-card">
        <span class="action-icon">➕</span>
        <span class="action-title">New Task</span>
      </button>
      <button id="recordTaskBtn" class="action-card">
        <span class="action-icon">🔴</span>
        <span class="action-title">Record Task</span>
      </button>

      <button id="pickerBtn" class="action-card">
        <span class="action-icon">🎯</span>
        <span class="action-title">Element Picker</span>
      </button>
      <button id="variablesBtn" class="action-card">
        <span class="action-icon">🔑</span>
        <span class="action-title">Variables</span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button id="manageTasksBtn" class="btn-link">📋 Open Full Dashboard</button>
      <span class="version-tag">v1.0.0</span>
    </footer>
  </div>

  <script src="../storage/storage.js"></script>
  <script src="../utils/messaging.js"></script>
  <script src="popup.js"></script>
</body>
</html>
